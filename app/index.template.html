  <!-- Early Dark Mode init to prevent FOUC -->
  <script>
    try {
      if (localStorage.getItem('detox_dark_mode') === 'true' || (!('detox_dark_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch (e) {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    }
  </script>

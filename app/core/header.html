<!-- Topbar Header (Compacto y nativo) -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-stone-900/90 backdrop-blur-md border-b border-stone-200/80 dark:border-stone-800 pt-safe transition-colors w-full">
      <div class="max-w-6xl mx-auto px-3 sm:px-4 py-2 sm:py-3 flex items-center justify-between gap-2">
        
        <!-- Logo & Titulo -->
        <div class="flex items-center gap-2 sm:gap-3 cursor-pointer min-w-0 flex-shrink" @click="activeTab = 'dia'">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-sage-500/15 dark:bg-sage-400/20 text-sage-700 dark:text-sage-400 flex items-center justify-center font-bold text-lg sm:text-xl shadow-xs border border-sage-500/20 flex-shrink-0">
            🌱
          </div>
          <div class="min-w-0">
            <h1 class="font-bold text-sm sm:text-lg leading-tight tracking-tight text-stone-900 dark:text-stone-50 flex items-center gap-1.5 truncate">
              <span>Detox</span><span class="hidden xs:inline sm:inline"> Primavera</span>
              <span class="text-[10px] sm:text-xs px-1.5 py-0.2 rounded-full font-semibold bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800 flex-shrink-0">
                <template v-if="challengeInfo.started && !challengeInfo.isFuture && !challengeInfo.isFinished">
                  Día {{ selectedDay }} <span v-if="selectedDay === challengeInfo.currentDay" class="opacity-75">• Hoy</span>
                </template>
                <template v-else-if="challengeInfo.isFuture">
                  Previa • Inicia en {{ challengeInfo.daysUntil }}d
                </template>
                <template v-else>
                  Día {{ selectedDay }}
                </template>
              </span>
            </h1>
            <p class="hidden sm:block text-xs text-stone-500 dark:text-stone-400">Guía interactiva & Tracker • Isa Caparra</p>
          </div>
        </div>

        <!-- Badges & Acciones Rápidas -->
        <div class="flex items-center gap-1 sm:gap-2 flex-shrink-0">
          
          <!-- Sincronización en la Nube (Universal) -->
          <button 
            @click="showSyncModal = true"
            :class="[
              syncKey ? 'bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-800 dark:text-emerald-300' : 'bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-600 dark:text-stone-300 border-stone-200/60 dark:border-stone-700',
              syncStatus === 'syncing' ? 'animate-pulse' : ''
            ]"
            class="flex items-center gap-1 px-2 py-1 sm:px-2.5 sm:py-1.5 border rounded-full text-xs font-semibold shadow-2xs transition active:scale-95 flex-shrink-0"
            :title="syncKey ? (syncStatus === 'syncing' ? 'Sincronizando con la nube...' : 'Sincronizado: ' + syncKey) : 'Vincular y sincronizar en la nube'">
            <span>{{ syncStatus === 'syncing' ? '🔄' : (syncKey ? '☁️' : '📲') }}</span>
            <span class="hidden xs:inline sm:inline text-[11px]">{{ syncKey ? syncKey : 'Sincronizar' }}</span>
          </button>

          <!-- Racha (Streak) -->
          <div class="flex items-center gap-1 px-2 py-1 sm:px-3 sm:py-1.5 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-full text-xs font-semibold text-amber-700 dark:text-amber-300 shadow-2xs" title="Racha de días completados">
            <span>🔥</span>
            <span>{{ streakDays }}d</span>
          </div>

          <!-- XP Acumulados (Solo desktop/tablet) -->
          <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-sage-50 dark:bg-sage-950/40 border border-sage-200 dark:border-sage-800/60 rounded-full text-xs font-semibold text-sage-800 dark:text-sage-300 shadow-2xs" title="Puntos de experiencia ganados">
            <span>✨</span>
            <span>{{ xp }} XP</span>
          </div>

          <!-- Buscador Global Cmd+K / Lupa -->
          <button 
            @click="globalSearchOpen = true"
            class="p-1.5 sm:px-3 sm:py-1.5 bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-600 dark:text-stone-300 rounded-xl text-xs font-medium transition active:scale-95 flex items-center gap-1.5"
            title="Buscar cualquier cosa (Cmd+K)">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span class="hidden md:inline">Buscar...</span>
            <kbd class="hidden md:inline px-1.5 py-0.5 text-[10px] bg-white dark:bg-stone-900 border border-stone-300 dark:border-stone-700 rounded shadow-xs">⌘K</kbd>
          </button>

          <!-- Toggle Dark Mode -->
          <button 
            @click="isDarkMode = !isDarkMode" 
            class="p-1.5 sm:p-2 rounded-xl bg-stone-100 hover:bg-stone-200 dark:bg-stone-800 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-300 transition active:scale-95" 
            :title="isDarkMode ? 'Modo Claro' : 'Modo Noche'">
            <span v-if="isDarkMode">☀️</span>
            <span v-else>🌙</span>
          </button>
        </div>

      </div>
    </header>

    <!-- Barra de Navegación Desktop (Oculta en Celular) -->
    <nav class="hidden md:block bg-white dark:bg-stone-900 border-b border-stone-200 dark:border-stone-800 sticky top-[57px] z-20 transition-colors">
      <div class="max-w-6xl mx-auto px-4 flex gap-1 sm:gap-2 overflow-x-auto no-scrollbar py-1">
        <button 
          @click="activeTab = 'dia'"
          :class="activeTab === 'dia' ? 'border-sage-600 text-sage-800 dark:text-sage-300 bg-sage-50/60 dark:bg-sage-950/40 font-semibold' : 'border-transparent text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200'"
          class="flex items-center gap-2 px-3.5 py-2.5 rounded-lg border-b-2 text-xs sm:text-sm whitespace-nowrap transition-all">
          <span>📅</span>
          <span>Mi Día & Tracker</span>
        </button>

        <button 
          @click="activeTab = 'recetas'"
          :class="activeTab === 'recetas' ? 'border-sage-600 text-sage-800 dark:text-sage-300 bg-sage-50/60 dark:bg-sage-950/40 font-semibold' : 'border-transparent text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200'"
          class="flex items-center gap-2 px-3.5 py-2.5 rounded-lg border-b-2 text-xs sm:text-sm whitespace-nowrap transition-all">
          <span>🥗</span>
          <span>Menú & Recetario</span>
        </button>

        <button 
          @click="activeTab = 'compras'"
          :class="activeTab === 'compras' ? 'border-sage-600 text-sage-800 dark:text-sage-300 bg-sage-50/60 dark:bg-sage-950/40 font-semibold' : 'border-transparent text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200'"
          class="flex items-center gap-2 px-3.5 py-2.5 rounded-lg border-b-2 text-xs sm:text-sm whitespace-nowrap transition-all">
          <span>🛒</span>
          <span>Lista de Compras</span>
          <span v-if="shoppingStats.pending > 0" class="ml-1 px-1.5 py-0.2 rounded-full text-[10px] bg-amber-200 dark:bg-amber-900/80 text-amber-900 dark:text-amber-200 font-bold">
            {{ shoppingStats.pending }}
          </span>
        </button>

        <button 
          @click="activeTab = 'semaforo'"
          :class="activeTab === 'semaforo' ? 'border-sage-600 text-sage-800 dark:text-sage-300 bg-sage-50/60 dark:bg-sage-950/40 font-semibold' : 'border-transparent text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200'"
          class="flex items-center gap-2 px-3.5 py-2.5 rounded-lg border-b-2 text-xs sm:text-sm whitespace-nowrap transition-all">
          <span>🚦</span>
          <span>¿Puedo comer esto?</span>
        </button>

        <button 
          @click="activeTab = 'sos'"
          :class="activeTab === 'sos' ? 'border-sage-600 text-sage-800 dark:text-sage-300 bg-sage-50/60 dark:bg-sage-950/40 font-semibold' : 'border-transparent text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200'"
          class="flex items-center gap-2 px-3.5 py-2.5 rounded-lg border-b-2 text-xs sm:text-sm whitespace-nowrap transition-all">
          <span>🆘</span>
          <span>Botiquín SOS</span>
        </button>

        <button 
          @click="activeTab = 'taller'"
          :class="activeTab === 'taller' ? 'border-sage-600 text-sage-800 dark:text-sage-300 bg-sage-50/60 dark:bg-sage-950/40 font-semibold' : 'border-transparent text-stone-600 dark:text-stone-400 hover:text-stone-900 dark:hover:text-stone-200'"
          class="flex items-center gap-2 px-3.5 py-2.5 rounded-lg border-b-2 text-xs sm:text-sm whitespace-nowrap transition-all">
          <span>🌿</span>
          <span>Herbolario & Taller</span>
        </button>
      </div>
    </nav>

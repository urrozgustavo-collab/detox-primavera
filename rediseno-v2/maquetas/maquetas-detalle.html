<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antes y después</title>
<style>
:root { --pg-bg:#E7E5E2; --pg-ink:#1E1C1A; --pg-mut:#615C57; --pg-line:#CFCBC6; --pg-sel:#1E1C1A; --pg-selink:#fff; }
@media (prefers-color-scheme: dark) { :root { --pg-bg:#1C1B1A; --pg-ink:#EEEBE7; --pg-mut:#A49E98; --pg-line:#3A3836; --pg-sel:#EEEBE7; --pg-selink:#1C1B1A; } }
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:var(--pg-bg); color:var(--pg-ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.pg-top { position:sticky; top:0; z-index:5; background:var(--pg-bg); border-bottom:1px solid var(--pg-line); padding:12px 20px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
.pg-top h1 { font-size:16px; margin:0 8px 0 0; font-weight:650; }
.pg-seg { display:flex; gap:4px; }
.pg-seg button { font:inherit; font-size:14px; border:1px solid var(--pg-line); background:transparent; color:var(--pg-ink); border-radius:999px; padding:6px 13px; cursor:pointer; }
.pg-seg button[aria-pressed="true"] { background:var(--pg-sel); color:var(--pg-selink); border-color:var(--pg-sel); }
.pg-intro { max-width:820px; padding:16px 20px 0; color:var(--pg-mut); margin:0; }
.pg-intro b { color:var(--pg-ink); }
section.cmp { padding:26px 20px 6px; }
section.cmp h2 { font-size:19px; margin:0 0 4px; }
section.cmp > p { margin:0 0 14px; color:var(--pg-mut); max-width:78ch; }
.pair { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-start; }
.pair figure { margin:0; }
.pair figcaption { font-size:13px; color:var(--pg-mut); margin:0 0 8px 4px; }
.pair figcaption b { color:var(--pg-ink); }

/* ---------- pantalla (recorte de celular) ---------- */
.scr {
  --bg:#FBF8F6; --surface:#FFFFFF; --soft:#F2ECE8; --ink:#2B2623; --ink-2:#514944; --muted:#7A6F69; --faint:#B5AAA3; --line:#ECE4DF;
  --accent:#4A6B55; --accent-ink:#fff; --coral:#C9542F;
  width:360px; border-radius:26px; overflow:hidden; background:var(--bg); color:var(--ink); padding:22px 22px 26px;
  font-family:"Segoe UI Variable Text","SF Pro Text",-apple-system,system-ui,Roboto,sans-serif; font-size:15.5px; line-height:1.45;
  box-shadow:0 0 0 1px rgba(0,0,0,.08), 0 16px 40px rgba(0,0,0,.14);
}
.scr.dark { --bg:#141110; --surface:#1E1A18; --soft:#2A2421; --ink:#F2EAE5; --ink-2:#D2C7C1; --muted:#A0948E; --faint:#6B605B; --line:#2C2623; --accent:#93BEA0; --accent-ink:#12201A; --coral:#EE8C6B; }
.disp { font-family:"Segoe UI Variable Display","SF Pro Display",-apple-system,system-ui,sans-serif; }
.h-big { font-size:34px; font-weight:250; letter-spacing:-.03em; line-height:1.05; margin:0 0 14px; }
.h-mid { font-size:24px; font-weight:300; letter-spacing:-.02em; line-height:1.15; margin:0 0 4px; }
.muted { color:var(--muted); }
svg.i { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.tabs { display:flex; gap:20px; font-size:15px; color:var(--muted); white-space:nowrap; overflow:hidden; }
.tabs b { color:var(--ink); font-weight:600; position:relative; }
.tabs b::after { content:""; position:absolute; left:0; right:0; bottom:-7px; height:2px; background:var(--coral); border-radius:1px; }

/* «antes»: lo actual */
.old-search { margin-top:20px; display:flex; gap:10px; align-items:center; background:var(--soft); border-radius:14px; padding:12px 14px; color:var(--muted); }
.old-chips { display:flex; gap:8px; margin-top:12px; overflow:hidden; white-space:nowrap; }
.old-chip { padding:8px 14px; border-radius:999px; background:var(--soft); color:var(--ink-2); font-size:14px; font-weight:500; }
.old-chip.on { background:var(--ink); color:var(--bg); }
.old-sel { display:flex; align-items:center; gap:12px; margin-top:16px; font-size:14px; color:var(--muted); }
.old-sel span.box { border:1px solid var(--faint); border-radius:8px; padding:7px 12px; color:var(--ink); font-size:16px; }
.old-sel .np { margin-left:auto; color:var(--ink); }
.old-ing { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
.old-ing .bx { width:24px; height:24px; border-radius:7px; border:1.5px solid var(--faint); flex:none; margin-top:1px; }
.old-ing .sg { font-size:12px; color:var(--muted); border-bottom:1px dotted var(--muted); }
.old-pills { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }

/* «después»: texto, líneas finas, una sola forma rellena */
.srch { margin-top:22px; display:flex; gap:10px; align-items:center; padding:0 0 12px; border-bottom:1px solid var(--line); color:var(--muted); }
.cats { display:flex; gap:20px; margin-top:18px; font-size:14.5px; color:var(--muted); white-space:nowrap; overflow:hidden; -webkit-mask-image:linear-gradient(90deg,#000 85%,transparent); mask-image:linear-gradient(90deg,#000 85%,transparent); }
.cats b { color:var(--ink); font-weight:600; }
.toolrow { display:flex; justify-content:space-between; align-items:center; margin-top:18px; font-size:14px; color:var(--muted); }
.toolrow a { color:var(--ink); display:inline-flex; align-items:center; gap:6px; }
.active-f { font-size:13.5px; color:var(--ink-2); }
.active-f span { color:var(--muted); margin-left:6px; }
.rrow { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
.rrow:last-child { border-bottom:0; }
.rrow .t { font-size:16px; }
.rrow .m { font-size:13px; color:var(--muted); white-space:nowrap; }
.count { font-size:13px; color:var(--muted); margin-top:18px; }

.sec-l { font-size:13px; color:var(--muted); margin:22px 0 6px; display:flex; justify-content:space-between; }
.sec-l .scale { color:var(--ink-2); display:flex; gap:14px; }
.sec-l .scale b { color:var(--ink); font-weight:600; border-bottom:1.5px solid var(--coral); }
.ing { display:grid; grid-template-columns:76px 1fr; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
.ing:last-child { border-bottom:0; }
.ing .q { color:var(--muted); font-variant-numeric:tabular-nums; font-size:14.5px; }
.ing .q sup { color:var(--coral); font-size:11px; margin-left:1px; }
.ing.off .n, .ing.off .q { color:var(--faint); text-decoration:line-through; text-decoration-color:var(--faint); }
.foot { font-size:12.5px; color:var(--muted); margin-top:10px; }
.foot sup { color:var(--coral); }
.step { display:grid; grid-template-columns:22px 1fr; gap:10px; padding:10px 0; }
.step b { font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums; font-size:14px; }

.opts { display:flex; gap:22px; margin-top:10px; font-size:16px; color:var(--muted); }
.opts b { color:var(--ink); font-weight:600; position:relative; }
.opts b::before { content:""; position:absolute; left:50%; bottom:-9px; width:5px; height:5px; border-radius:50%; background:var(--coral); transform:translateX(-50%); }
.opts small { display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:1px; }
.radio { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
.radio:last-child { border-bottom:0; }
.radio .t { flex:1; }
.radio .t small { display:block; color:var(--muted); font-size:13px; }
.radio .ok { color:var(--accent); }
.cta { display:flex; justify-content:space-between; align-items:center; margin-top:26px; }
.btn-pri { background:var(--ink); color:var(--bg); padding:12px 24px; border-radius:999px; font-weight:600; font-size:15px; }
.btn-txt { color:var(--muted); font-size:15px; }

.nums { display:flex; justify-content:space-between; margin:6px 0 4px; }
.nums span { width:40px; text-align:center; font-size:18px; color:var(--faint); padding:6px 0; font-variant-numeric:tabular-nums; }
.nums span.on { color:var(--ink); font-weight:600; border-bottom:2px solid var(--coral); }
.nums-l { text-align:center; font-size:13px; color:var(--muted); }
.ttog { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:15px; color:var(--muted); margin-top:4px; }
.ttog b { color:var(--ink); font-weight:600; }
.ttog b::before { content:"✓ "; color:var(--accent); font-weight:600; }
.sheet-h { display:flex; justify-content:space-between; align-items:baseline; }
.grab { width:38px; height:4px; border-radius:2px; background:var(--line); margin:-8px auto 18px; }
</style>
</head>
<body>
<div class="pg-top">
  <h1>Detalles: antes y después</h1>
  <div class="pg-seg" id="selMode" role="group" aria-label="Tema">
    <button data-v="dark" aria-pressed="true">Oscuro</button>
    <button data-v="light" aria-pressed="false">Claro</button>
  </div>
</div>
<p class="pg-intro">Una sola regla para toda la app: <b>texto y líneas finas para casi todo, y una sola forma rellena por pantalla</b> (la acción principal). Nada de píldoras grises, casillas cuadradas ni recuadros del sistema. Los títulos grandes quedan como están.</p>
<div id="out"></div>

<script>
const IC = {
  buscar:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
  filtro:'<path d="M4 7h16M7 12h10M10 17h4"/>',
  plus:'<path d="M12 6v12M6 12h12"/>',
  check:'<path d="m5 12 4.5 4.5L19 7"/>',
  x:'<path d="M7 7l10 10M17 7 7 17"/>',
  chev:'<path d="m6 9 6 6 6-6"/>'
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
const recs = [['Agua de lino','5 min'],['Alcauciles con aliño de limón','40 min'],['Aliño cremoso de palta','5 min'],['Bowl de yamaní con crucíferas','25 min'],['Caldo détox alcalinizante','35 min']];

const S = [
 { t:'1 · Filtros de recetas', d:'Las dos filas de píldoras y el desplegable del sistema se reemplazan por una línea de categorías en texto y un solo «Filtrar» que abre un panel. Los filtros activos se leen como una frase corta que se borra con la ✕.',
   before:()=>`<div class="h-big disp">Cocina</div><div class="tabs"><b>Recetas</b><span>Plan</span><span>Compras</span><span>Heladera</span><span>Más</span></div>
     <div class="old-search">${ic('buscar')}Buscar receta o ingrediente</div>
     <div class="old-chips"><span class="old-chip on">Todas</span><span class="old-chip">Platos y guisos</span><span class="old-chip">Ensaladas</span><span class="old-chip">Sopas y cr</span></div>
     <div class="old-chips"><span class="old-chip">Aptas para hoy</span><span class="old-chip">Aptas para mí</span><span class="old-chip">Favoritas</span><span class="old-chip">Ráp</span></div>
     <div class="old-sel">Orden <span class="box">Sugeridas ⌄</span><span class="np">+ Receta propia</span></div>`,
   after:()=>`<div class="h-big disp">Cocina</div><div class="tabs"><b>Recetas</b><span>Plan</span><span>Compras</span><span>Heladera</span><span>Más</span></div>
     <div class="srch">${ic('buscar')}Buscar receta o ingrediente</div>
     <div class="cats"><b>Todas</b><span>Platos</span><span>Ensaladas</span><span>Sopas</span><span>Dips</span><span>Desayunos</span></div>
     <div class="toolrow"><span class="active-f">Aptas para hoy<span>✕</span></span><a>${ic('filtro')}Filtrar</a></div>
     ${recs.map(([t,m])=>`<div class="rrow"><span class="t">${t}</span><span class="m">${m}</span></div>`).join('')}`,
   extra:{ cap:'<b>Después</b> · al tocar «Filtrar»', html:()=>`<div class="grab"></div><div class="sheet-h"><div class="h-mid disp">Filtrar</div><span class="muted">Limpiar</span></div>
     <div class="sec-l">Mostrar</div>
     <div class="radio"><span class="t">Aptas para hoy<small>Según la fase del programa</small></span><span class="ok">${ic('check')}</span></div>
     <div class="radio"><span class="t">Sin mis alergias</span></div>
     <div class="radio"><span class="t">Favoritas</span></div>
     <div class="radio"><span class="t">Rápidas, 20 min o menos</span></div>
     <div class="sec-l">Ordenar por</div>
     <div class="opts" style="font-size:15px"><b>Sugeridas</b><span>A–Z</span><span>Tiempo</span></div>
     <div class="cta"><span class="btn-txt">+ Receta propia</span><span class="btn-pri">Ver 38 recetas</span></div>` } },
 { t:'2 · Ingredientes y pasos', d:'Sin casillas: cada ingrediente es un renglón con la cantidad en una columna gris a la izquierda. Tocar el renglón lo tacha suave (las casillas quedan solo para el modo cocina). La aclaración «sugerida» pasa a ser un asterisco coral y una sola nota al pie.',
   before:()=>`<div class="sec-l" style="margin-top:0">Ingredientes</div>
     <div class="old-ing"><span class="bx"></span><span>1 taza de arroz basmati integral, largo fino o yamaní (preferentemente orgánico) <span class="sg">≈ sugerida</span></span></div>
     <div class="old-ing"><span class="bx"></span><span>2 tazas de agua <span class="sg">≈ sugerida</span></span></div>
     <div class="old-ing"><span class="bx"></span><span>1 pizca de sal marina <span class="sg">≈ sugerida</span></span></div>
     <div class="old-ing"><span class="bx"></span><span>Condimentar solo con sal, gomasio o salsa shoyu</span></div>
     <div class="sec-l">Pasos</div>
     <div class="old-ing" style="border:0"><span style="color:var(--accent);font-weight:600">2</span><span>Llevar el agua con una pizca de sal a hervor, sin tapa y a fuego alto, y agregar el arroz.</span></div>`,
   after:()=>`<div class="sec-l" style="margin-top:0">Ingredientes <span class="scale"><span>½</span><b>×1</b><span>×2</span></span></div>
     <div class="ing"><span class="q">1 taza<sup>*</sup></span><span class="n">Arroz integral basmati o yamaní, mejor orgánico</span></div>
     <div class="ing off"><span class="q">2 tazas<sup>*</sup></span><span class="n">Agua</span></div>
     <div class="ing"><span class="q">1 pizca<sup>*</sup></span><span class="n">Sal marina</span></div>
     <div class="ing"><span class="q">a gusto</span><span class="n">Gomasio o salsa shoyu</span></div>
     <div class="foot"><sup>*</sup> Cantidad sugerida: la guía no la indica.</div>
     <div class="sec-l">Preparación</div>
     <div class="step"><b>2</b><span>Llevá el agua con la sal a hervor, sin tapa y a fuego alto, y agregá el arroz.</span></div>
     <div class="step"><b>3</b><span>Cuando hierva, bajá a mínimo y tapá. No revuelvas hasta que se evapore el agua.</span></div>` },
 { t:'3 · Fecha y forma de empezar', d:'Las opciones son palabras, no botones: la elegida en negrita con un puntito coral. Las alternativas largas (cómo empezar) se eligen en una lista con una tilde, y la única forma rellena es «Empezar».',
   before:()=>`<div class="sec-l" style="margin-top:0">Fecha de inicio</div>
     <div class="old-pills"><span class="old-chip on">Hoy 18/11</span><span class="old-chip">Mañana 19/11</span><span class="old-chip">Próximo lunes 23/11</span></div>
     <div class="sec-l">Cómo empezar</div>
     <div class="old-pills"><span class="old-chip on">3 días de monodieta (recomendado)</span><span class="old-chip">2 días de monodieta</span><span class="old-chip">1 día</span><span class="old-chip">Directo</span></div>`,
   after:()=>`<div class="h-mid disp">Empezar el detox</div><div class="muted" style="font-size:14px">21 días · guía de Isabel Caparra</div>
     <div class="sec-l">Fecha de inicio</div>
     <div class="opts"><b>Hoy<small>18/11</small></b><span>Mañana<small>19/11</small></span><span>Lunes<small>23/11</small></span><span>Otra…</span></div>
     <div class="sec-l" style="margin-top:28px">Cómo empezar</div>
     <div class="radio"><span class="t">3 días de monodieta<small>Recomendado por la guía</small></span><span class="ok">${ic('check')}</span></div>
     <div class="radio"><span class="t">2 días de monodieta</span></div>
     <div class="radio"><span class="t">1 día de monodieta</span></div>
     <div class="radio"><span class="t">Directo al menú depurativo</span></div>
     <div class="cta"><span class="btn-txt">Después</span><span class="btn-pri">Empezar</span></div>` },
 { t:'4 · El mismo sistema en «¿Cómo te sentís?»', d:'Para ver que la regla funciona en toda la app: la energía es una fila de números (el elegido subrayado en coral, con su palabra debajo) y las señales son palabras que se tildan, sin cápsulas.',
   before:()=>`<div class="h-mid disp">¿Cómo te sentís hoy?</div>
     <div class="sec-l">Energía</div><div class="old-pills">${[1,2,3,4,5].map(n=>`<span class="old-chip ${n===4?'on':''}" style="width:44px;text-align:center">${n}</span>`).join('')}</div>
     <div class="sec-l">Señales</div><div class="old-pills"><span class="old-chip on">Ninguna</span><span class="old-chip">Cefalea leve</span><span class="old-chip">Sed intensa</span><span class="old-chip">Frío</span><span class="old-chip">+ Otra</span></div>`,
   after:()=>`<div class="h-mid disp">¿Cómo te sentís hoy?</div>
     <div class="sec-l">Energía</div><div class="nums">${[1,2,3,4,5].map(n=>`<span class="${n===4?'on':''}">${n}</span>`).join('')}</div><div class="nums-l">Buena</div>
     <div class="sec-l">Señales</div><div class="ttog"><b>Ninguna</b><span>Cefalea leve</span><span>Sed intensa</span><span>Frío</span><span>Otra…</span></div>
     <div class="cta"><span class="btn-txt">Cancelar</span><span class="btn-pri">Guardar</span></div>` }
];
let M = 'dark';
function render() {
  const sc = h => `<div class="scr ${M==='dark'?'dark':''}">${h}</div>`;
  document.getElementById('out').innerHTML = S.map(s => `<section class="cmp"><h2>${s.t}</h2><p>${s.d}</p><div class="pair">
    <figure><figcaption><b>Antes</b> · como está hoy</figcaption>${sc(s.before())}</figure>
    <figure><figcaption><b>Después</b></figcaption>${sc(s.after())}</figure>
    ${s.extra?`<figure><figcaption>${s.extra.cap}</figcaption>${sc(s.extra.html())}</figure>`:''}</div></section>`).join('');
}
document.getElementById('selMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b)); M = b.dataset.v; render(); });
render();
</script>
</body>
</html>

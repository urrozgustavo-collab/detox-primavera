/* ==== base.css ==== */

}

/* ==== components.css ==== */
/* Componentes reutilizables: tarjetas, botones arquitectónicos, chips, segmentos, diálogos y gráficos. */
.card {
  background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-card);
  padding: 20px; box-shadow: var(--shadow); min-width: 0; position: relative;
}

/* ---------- botones (arquitectónicos, sin píldoras infladas) ---------- */
.btn {

  min-height: 40px; height: auto; padding: 8px 16px;

}
.chip.soft { background: var(--sage-soft); color: var(--ink-2); border-color: color-mix(in srgb, var(--sage) 55%, transparent); }
.chip.soft:hover { background: color-mix(in srgb, var(--sage) 45%, var(--surface)); }
.chip.soft[aria-pressed="true"], .chip.soft.on {
  background: var(--bloom-soft); color: var(--bloom-text);
  border-color: color-mix(in srgb, var(--bloom) 35%, transparent); font-weight: 600; box-shadow: none;
}
.chip .x { margin-right: -4px; }

.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px;
  font-size: var(--fs-12); font-weight: 600; letter-spacing: 0.01em;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap; line-height: 1.55;
}
.tag.accent { background: var(--accent-soft); color: var(--accent-text); }
.tag.bloom { background: var(--bloom-soft); color: var(--bloom-text); }
.tag.pollen { background: var(--pollen-soft); color: var(--pollen-text); }
.tag.clay, .tag.alert { background: var(--clay-soft); color: var(--clay-text); }
.tag.warn { background: var(--warn-soft); color: var(--warn-text); }

.badge {
  display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px;
  border-radius: var(--r-pill); background: var(--bloom-text); color: #fff; font-size: 11px; font-weight: 700; line-height: 1;
}
:root[data-theme="dark"] .badge { background: var(--bloom); color: #1a1013; }

.seg {
  display: inline-flex; padding: 4px; border-radius: 12px; background: var(--surface-2);
  border: 1px solid var(--border-subtle); gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none;
}
.seg::-webkit-scrollbar { display: none; }
.seg button, .seg a {
  min-height: 34px; padding: 0 13px; border-radius: var(--r-sm); font-weight: 600; font-size: 0.8125rem;
  color: var(--muted); white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease), box-shadow var(--t-fast);
}
.seg button:hover, .seg a:hover { color: var(--ink); }
.seg [aria-pressed="true"], .seg [aria-current="page"], .seg [aria-selected="true"] {
  background: var(--surface); color: var(--ink);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .08), 0 1px 1px rgba(0, 0, 0, .04);
}
.subnav { margin: 6px 0 18px; }

/* ---------- formularios ---------- */
.field { display: block; margin-bottom: 14px; }
.field > span, .label { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; letter-spacing: -0.005em; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 9px 13px; border: 1px solid var(--border-ctl); border-radius: var(--r-ctl);
  background: var(--surface); color: var(--ink); font-size: var(--fs-16);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .02);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--muted); opacity: .82; }
.search { position: relative; }
.search > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 42px; }
.search.big .input { min-height: 50px; font-size: 1rem; border-radius: 14px; padding-left: 44px; box-shadow: var(--shadow-xs); }
.check { display: flex; align-items: center; gap: 12px; min-height: 42px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; border-radius: 6px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 50px; cursor: pointer; }
.switch input {
  appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 13px;
  background: var(--line-strong); position: relative; flex: none; transition: background var(--t-fast); cursor: pointer;
}
.switch input::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: transform var(--t-fast) var(--ease); box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(20px); }

/* ---------- listas ---------- */
.list { list-style: none; margin: 0; padding: 0; }
.list > li + li { border-top: 1px solid var(--border-subtle); }
.li { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 8px 0; min-width: 0; }
.li .grow > b, .li .grow > .t { display: block; font-weight: 600; }
a.li, button.li { width: 100%; text-align: left; color: inherit; text-decoration: none; }
a.li:hover .chev, button.li:hover .chev { transform: translateX(2px); }
.chev { color: var(--muted); transition: transform var(--t-fast); }

/* ---------- casilla animada ---------- */
.tick {
  width: 26px; height: 26px; border-radius: 50%; border: 1.75px solid var(--line-strong);
  background: var(--surface); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .04);
  display: grid; place-items: center; flex: none;
  transition: background var(--t-fast), border-color var(--t-fast), transform var(--t-fast); color: transparent;
}
.tick:active { transform: scale(.92); }
.tick svg { width: 16px; height: 16px; stroke-width: 2.6; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset var(--t-med) var(--ease); }
.is-done .tick, .tick.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: none; }
.is-done .tick svg, .tick.on svg { stroke-dashoffset: 0; }
.is-skip .tick { border-style: dashed; color: var(--muted); box-shadow: none; }
.tick.sq { border-radius: var(--r-sm); width: 24px; height: 24px; }

/* ---------- diálogos (hoja inferior en celular) ---------- */
dialog { border: 0; padding: 0; color: var(--ink); background: var(--surface); max-width: 100%; }
dialog::backdrop { background: var(--scrim); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
dialog.sheet {
  width: 100%; max-width: 640px; max-height: 92vh; max-height: 92dvh; margin: auto auto 0; border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow-pop); border: 1px solid var(--border-subtle); display: flex; flex-direction: column; overflow: hidden;
}
dialog.sheet:not([open]) { display: none; }
dialog.sheet[open] { animation: sheet-in var(--t-med) var(--ease); }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 12px 12px 20px; border-bottom: 1px solid var(--border-subtle); }
.sheet-h h2 { flex: 1; font-size: var(--fs-22); }
.sheet-b { padding: 18px 20px 22px; overflow-y: auto; overscroll-behavior: contain; }
.sheet-f { padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.grabber { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 8px auto 0; }
@media (min-width: 720px) {
  dialog.sheet { margin: auto; border-radius: 22px; max-height: 86vh; }
  .grabber { display: none; }
}
dialog.full { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; border-radius: 0; background: var(--paper); }

/* ---------- avisos ---------- */
#toasts, .toast-host { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom)); z-index: 60; display: flex; flex-direction: column; gap: 8px; width: min(520px, calc(100% - 24px)); pointer-events: none; }
@media (min-width: 960px) { #toasts { bottom: 24px; left: calc(50% + var(--rail) / 2); } }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 14px; background: var(--ink); color: var(--paper); box-shadow: var(--shadow-pop); animation: toast-in var(--t-med) var(--ease); font-size: var(--fs-14); }
.toast b { font-weight: 600; }
.toast .grow { line-height: 1.4; }
.toast button { color: var(--accent-soft); font-weight: 700; padding: 6px 8px; border-radius: var(--r-sm); }
:root[data-theme="dark"] .toast button { color: var(--accent-text); }
.toast.out { opacity: 0; transform: translateY(8px); transition: all var(--t-fast); }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }
.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 13px 15px; border-radius: 14px;
  background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 18%, transparent);
  color: var(--warn-text); font-size: var(--fs-14); margin-bottom: 14px;
}
.banner.info {
  background: color-mix(in srgb, var(--accent-soft) 75%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-text);
}
.banner.danger {
  background: var(--danger-soft); border-color: color-mix(in srgb, var(--danger) 20%, transparent);
  color: var(--danger-text);
}
.banner .grow b { display: block; margin-bottom: 1px; }
.note { font-size: var(--fs-14); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 11px 13px; }
.health { font-size: 0.8125rem; color: var(--muted); border-top: 1px solid var(--border-subtle); margin-top: 28px; padding-top: 14px; display: flex; gap: 8px; align-items: flex-start; }

/* ---------- vacíos ---------- */
.empty { text-align: center; padding: 32px 18px; color: var(--ink-2); }
.empty svg.art { width: 84px; height: 84px; margin: 0 auto 12px; color: var(--accent); opacity: .85; }
.empty h3 { font-family: var(--f-display); font-weight: 800; font-size: var(--fs-22); margin-bottom: 6px; color: var(--ink); }
.empty p { max-width: 44ch; margin: 0 auto 16px; }

/* ---------- anillo y gráficos ---------- */
.ring { position: relative; flex: none; }
.ring svg { transform: rotate(-90deg); }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: var(--accent); transition: stroke-dashoffset 600ms var(--ease); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring .lbl b { font-family: var(--f-display); font-weight: 800; font-size: var(--fs-28); font-variant-numeric: lining-nums tabular-nums; }
.ring .lbl small { display: block; font-size: var(--fs-12); }
.chart { width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-text); }
.chart .axis { stroke: var(--line); }
.chart .l1 { stroke: var(--accent); fill: none; stroke-width: 2.25; }
.chart .l2 { stroke: var(--bloom); fill: none; stroke-width: 2.25; stroke-dasharray: 5 4; }
.chart .l3 { stroke: var(--pollen); fill: none; stroke-width: 2; }
.chart .avg { stroke: var(--muted); stroke-dasharray: 2 4; }
.chart .dot1 { fill: var(--accent); } .chart .dot2 { fill: var(--bloom); }
.chart .bar { fill: var(--accent); } .chart .bar2 { fill: var(--pollen); } .chart .bar-goal { stroke: var(--bloom); stroke-dasharray: 4 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-12); color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 720px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow-xs); }
.stats .stat:nth-child(1) { border-top: 3px solid var(--accent); }
.stats .stat:nth-child(2) { border-top: 3px solid var(--pollen); }
.stats .stat:nth-child(3) { border-top: 3px solid var(--bloom); }
.stats .stat:nth-child(4) { border-top: 3px solid var(--clay); }
.stat b { display: block; font-family: var(--f-display); font-weight: 800; font-size: var(--fs-28); line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; margin-bottom: 4px; }
.stat span { font-size: 0.75rem; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
.bar-h { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar-h > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

/* ---------- temporizadores ---------- */
#timers { position: fixed; right: 12px; bottom: calc(var(--tabbar-h) + 12px + env(safe-area-inset-bottom)); z-index: 55; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
@media (min-width: 960px) { #timers { bottom: 20px; right: 20px; } }
.timer-pill { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--border-ctl); box-shadow: var(--shadow-pop); font-weight: 600; font-size: var(--fs-14); max-width: calc(100vw - 24px); }
.timer-pill .num { font-size: var(--fs-18); min-width: 4ch; text-align: right; }
.timer-pill.ring-now { background: var(--bloom-text); color: #fff; border-color: var(--bloom-text); animation: pulse 1s ease-in-out infinite; }
:root[data-theme="dark"] .timer-pill.ring-now { background: var(--bloom); border-color: var(--bloom); color: #1a1013; }
@keyframes pulse { 50% { transform: scale(1.04); } }

canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

.toast-host { bottom: calc(16px + env(safe-area-inset-bottom)) !important; left: 50% !important; }
.cook-timers { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding-top: 8px; }
.cook-timers:empty { display: none; }
:root[data-theme="dark"] .btn.danger.solid { color: #1a0c09; }

/* ==== screens.css ==== */
/* Detox v2 — Estilos por pantalla («Collage Botánico de Isabel Caparra»). */

/* ---------- elementos comunes y utilidades de pantalla ---------- */
.avatar { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-size: 17px; font-weight: 700; line-height: 1; flex: none; }
.plant-mark { display: inline-block; }
.plant-mark svg { width: auto; }
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; min-height: 40px; margin-bottom: 6px; }
.flash { animation: flash 1.6s var(--ease); }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--bloom); } 100% { box-shadow: 0 0 0 0 transparent; } }
.page-h { margin: 8px 0 16px; }
.page-h h1 { font-size: var(--fs-36); font-weight: 800; letter-spacing: -0.03em; }
.page-h h1::after { content: ""; display: block; width: 28px; height: 5px; margin-top: 8px; background: var(--ink); border-radius: 1px; }
.page-h p { color: var(--ink-2); margin-top: 6px; }
kbd { font-family: inherit; font-size: var(--fs-12); border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px; }

/* ---------- planta collage botánico (portada Isabel Caparra) ---------- */
.plant .pl-blob { fill: var(--sage); opacity: .88; }
.plant .pl-loop { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; }
.plant .pl-amber { fill: var(--pollen); }
.plant .pl-cinnamon { fill: var(--clay); }
.plant .pl-berry { fill: var(--bloom); }
.plant .pl-euca { fill: var(--accent); }
.plant .pl-speck { fill: var(--accent); }
.hero-plant.grew svg { animation: grow 900ms var(--ease); transform-origin: 50% 100%; }
@keyframes grow { from { opacity: .2; transform: scale(.94); } }

/* ---------- Hoy: hero & día ---------- */
.hero-card {
  background: radial-gradient(circle at 88% 24%, color-mix(in srgb, var(--sage-soft) 55%, transparent), transparent 48%),
    linear-gradient(155deg, var(--surface) 42%, color-mix(in srgb, var(--paper) 62%, var(--surface)));
  border-color: var(--border-subtle); padding: 20px 22px; margin-bottom: 14px;
}
.hero { display: flex; align-items: center; gap: 16px; margin: 0; }
.hero-txt { flex: 1; min-width: 0; }
.hero-date { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem; font-weight: 700; color: var(--muted); margin: 0 0 4px; }
.day-num { font-size: clamp(2.3rem, 6vw, 3.15rem); line-height: 1.02; margin: 0 0 12px; font-weight: 800; letter-spacing: -0.03em; }
.day-num .num { font-weight: 800; letter-spacing: -0.03em; }
.day-num small { font-size: var(--fs-22); font-weight: 600; color: var(--muted); font-family: var(--f-display); }
.hero-desc { color: var(--ink-2); max-width: 48ch; margin-top: 10px; font-size: 0.9375rem; line-height: 1.5; }
@media (max-width: 600px) { .hero-desc:not(.open) { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; } }
.hero-plant { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.hero-plant .meta { font-size: var(--fs-12); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
@media (max-width: 420px) { .hero-plant svg { width: 96px; height: 112px; } .hero { gap: 10px; } }
.phase-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 9px; border-radius: var(--r-pill); font-weight: 600; font-size: 0.8125rem; line-height: 1.25; background: var(--accent-soft); color: var(--accent-text); border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent); }
.phase-chip.ph-monodieta { background: var(--pollen-soft); color: var(--pollen-text); border-color: color-mix(in srgb, var(--pollen) 25%, transparent); }
.phase-chip.ph-previa { background: var(--bloom-soft); color: var(--bloom-text); border-color: color-mix(in srgb, var(--bloom) 25%, transparent); }

/* ---------- tira de días (calendario cápsula) ---------- */
.daystrip {
  display: flex; gap: 7px; overflow-x: auto; padding: 4px var(--gutter) 12px; margin: 0 calc(-1 * var(--gutter)) 10px;
  scrollbar-width: none; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
}
.daystrip::-webkit-scrollbar { display: none; }
.ds {
  flex: none; width: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 8px 0 6px; border-radius: 12px; border: 1px solid var(--border-subtle);
  background: var(--surface); box-shadow: var(--shadow-xs); text-decoration: none; color: var(--ink-2);
  scroll-snap-align: center;
  transition: transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.ds:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--ink) 25%, transparent); box-shadow: var(--shadow); }
.ds small { font-size: var(--fs-12); color: var(--muted); line-height: 1.2; font-weight: 600; text-transform: uppercase; }
.ds b { font-family: var(--f-display); font-weight: 700; font-size: var(--fs-18); font-variant-numeric: lining-nums tabular-nums; line-height: 1.2; }
.ds i { height: 14px; display: grid; place-items: center; }
.ds i svg { width: 14px; height: 14px; }
.ds-complete { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); }
.ds-complete i::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.ds-partial i::before { content: ""; width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--accent); }
.ds-grace { color: var(--accent-text); }
.ds-future { opacity: .65; }
.ds.today { border: 1.5px solid var(--bloom); }
.ds.on { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: var(--shadow-xs); transform: none; }
.ds.on small { color: inherit; opacity: .8; }
.ds.on i::before { background: var(--paper); border-color: var(--paper); }

/* ---------- estructura y tarjetas de Hoy ---------- */
.hoy-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
.hoy-grid .col > * + * { margin-top: 14px; }
@media (min-width: 960px) { .hoy-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); align-items: start; } }

.ring-card { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
@media (max-width: 520px) { .ring-card .ring { margin: 0 auto; } }
.ring-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; flex: 1; min-width: 210px; }
@media (max-width: 380px) { .ring-stats { grid-template-columns: 1fr; } }
.ring-stat { background: var(--surface-2); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 10px 10px; text-align: center; }
.ring-stats .ring-stat:nth-child(1) { background: var(--sage-soft); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
.ring-stats .ring-stat:nth-child(2) { background: var(--pollen-soft); border-color: color-mix(in srgb, var(--pollen) 28%, transparent); }
.ring-stats .ring-stat:nth-child(3) { background: var(--bloom-soft); border-color: color-mix(in srgb, var(--bloom) 25%, transparent); }
.ring-stat b { display: block; font-size: 1.35rem; line-height: 1.1; font-family: var(--f-display); font-weight: 800; font-variant-numeric: lining-nums tabular-nums; margin-bottom: 2px; }
.ring-stat span { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; display: block; }
.done-line, .grace-line { flex-basis: 100%; margin: 6px 0 0; display: flex; align-items: center; gap: 6px; font-size: 0.875rem; }
.done-line { color: var(--bloom-text); font-weight: 600; }

.habits { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.list.habits > li + li { border-top: 0; }
.habit {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
  border: 1px solid var(--border-subtle); border-radius: 13px;
  padding: 4px 10px 4px 6px; background: var(--surface);
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.habit.is-done {
  background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface));
  border-color: color-mix(in srgb, var(--accent) 24%, transparent);
}
.habit-main {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left;
  min-height: 48px; padding: 6px 8px; border-radius: 10px;
  transition: background var(--t-fast) var(--ease);
}
.habit-main:hover:not([disabled]) { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.habit-main[disabled] { cursor: default; }
.habit-main .grow { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.h-t { font-weight: 500; line-height: 1.35; color: var(--ink); }
.is-done .h-t { color: var(--muted); }
.habit-side { display: flex; align-items: center; gap: 4px; }
.habit-tip { flex-basis: 100%; margin: 4px 6px 6px 44px; font-size: var(--fs-14); color: var(--ink-2); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.warn-tip { color: var(--warn-text); display: flex; gap: 6px; align-items: flex-start; background: var(--warn-soft); }

.water .glass .gl { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-linejoin: round; }
.water .glass .gw { fill: color-mix(in srgb, var(--accent) 40%, transparent); transition: y 600ms var(--ease); }
.water-num { margin: 0 0 6px; }
.water-num b { font-size: var(--fs-28); font-weight: 800; }

.slot + .slot { border-top: 1px solid var(--border-subtle); margin-top: 12px; padding-top: 12px; }
.slot-h { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.slot-h h3 { display: inline-flex; align-items: center; gap: 7px; font-size: 1rem; font-weight: 700; color: var(--ink); }
.meals { margin: 2px 0 6px; }
.meal { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.meal.is-done .grow { color: var(--muted); text-decoration: line-through; }
.meal .grow a { color: inherit; text-decoration-color: var(--line-strong); }
.slot .chips { margin-top: 8px; gap: 8px; }
.slot .chips .chip.sug { border: 1px solid var(--border-ctl); background: var(--surface); border-radius: 10px; padding: 7px 11px; white-space: normal; text-align: left; height: auto; max-width: 100%; }
.slot .chips .chip.sug .sug-title { font-weight: 600; color: var(--ink); }
.chip.sug, .chip.wrap { white-space: normal; text-align: left; height: auto; padding-top: 6px; padding-bottom: 6px; flex: 0 1 auto; max-width: 100%; }
.slot .chips .chip { flex: 0 1 auto; max-width: 100%; white-space: normal; text-align: left; display: inline-flex; align-items: center; line-height: 1.4; padding: 6px 11px; }
.slot .chips .chip svg { vertical-align: -2px; margin-right: 4px; }

.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
.scale .sc {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 9px 4px; border-radius: 12px; border: 1px solid var(--border-subtle);
  background: var(--surface); box-shadow: var(--shadow-xs); min-height: 60px;
  transition: all var(--t-fast) var(--ease);
}
.scale .sc:hover { border-color: color-mix(in srgb, var(--ink) 25%, transparent); transform: translateY(-1px); }
.sc span { font-size: 22px; line-height: 1.1; }
.sc small { font-size: var(--fs-12); color: var(--muted); text-align: center; line-height: 1.2; font-weight: 500; }
.sc.on {
  background: var(--accent-soft); border-color: var(--accent);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent);
}
.sc.on small { color: var(--accent-text); font-weight: 600; }
.checkin .label { margin-top: 6px; }
.symp { display: inline-flex; align-items: center; gap: 4px; }
.sos-link { font-size: var(--fs-12); font-weight: 700; display: inline-flex; align-items: center; gap: 2px; color: var(--danger-text); }
.notes .day-note { font-family: var(--f-text); font-size: 1rem; line-height: 1.6; }
.quote { margin: 12px 0 0; padding: 0 0 0 14px; border-left: 3px solid var(--bloom); }
.quote blockquote { margin: 0; font-family: var(--f-text); font-style: italic; font-size: 1rem; line-height: 1.55; }
.quote figcaption { font-size: var(--fs-14); color: var(--muted); margin-top: 4px; }

.welcome { max-width: 640px; margin: 10px auto; }
.welcome-art { display: flex; justify-content: center; margin-bottom: 6px; }
.welcome h1 { text-align: center; }
.welcome > p.muted { text-align: center; }
.countdown .big-count { font-size: 4rem; line-height: 1; color: var(--accent-text); }
.closing .stats { margin-top: 10px; }
.closing .stat { background: var(--surface); }
.stack-s > * + * { margin-top: 2px; }

/* ---------- recetas & cards compartidas ---------- */
.toolbar-card {
  background: var(--surface); border: 1px solid var(--border-subtle);
  border-radius: var(--r-card); padding: 14px 16px; box-shadow: var(--shadow-xs);
}
.toolbar-card > * + * { margin-top: 12px; }
.recipe-hero {
  background: linear-gradient(155deg, var(--surface) 55%, color-mix(in srgb, var(--paper) 45%, var(--surface)));
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-card); padding: 20px; box-shadow: var(--shadow);
}
.rcard {
  display: flex; flex-direction: column; gap: 8px; padding: 18px;
  border-radius: var(--r-card); border: 1px solid var(--border-subtle); border-top: 3px solid var(--accent);
  background: var(--surface); text-decoration: none; color: var(--ink);
  min-width: 0; box-shadow: var(--shadow-xs);
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.grid-cards > .rcard:nth-child(3n+2) { border-top-color: var(--pollen); }
.grid-cards > .rcard:nth-child(3n+3) { border-top-color: var(--bloom); }
.rcard:hover {
  border-color: color-mix(in srgb, var(--accent) 45%, transparent);
  box-shadow: var(--shadow-md); transform: translateY(-1px);
}
.rc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rc-top .fav { color: var(--pollen); display: inline-flex; flex: none; }
.rc-top .fav svg { fill: currentColor; }
.rc-cat { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-text); }
.rc-t { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; line-height: 1.25; letter-spacing: -0.02em; color: var(--ink); }
.rc-foot {
  margin-top: auto; padding-top: 9px; border-top: 1px solid var(--border-subtle);
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  font-size: 0.8125rem; color: var(--muted);
}
.rc-m { display: inline-flex; align-items: center; gap: 4px; }
.rc-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: var(--fs-14); color: var(--muted); }
.rc-meta .fav { color: var(--pollen); }
.rc-meta .fav svg { fill: currentColor; }
.rc-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.rc-tags:empty { display: none; }
.rc-why { font-size: var(--fs-14); color: var(--ink-2); }
.recipe-h h1 { font-size: var(--fs-36); font-weight: 800; letter-spacing: -0.03em; margin: 4px 0 8px; }
.recipe-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--ink-2); font-size: var(--fs-14); }
.recipe-meta span { display: inline-flex; align-items: center; gap: 4px; }
.ing-list li { display: flex; align-items: center; gap: 12px; min-height: 46px; border-top: 1px solid var(--border-subtle); }
.ing-list li:first-child { border-top: 0; }
.ing-list .qty { font-weight: 700; font-variant-numeric: tabular-nums; }
.ing-list .is-done .txt { text-decoration: line-through; color: var(--muted); }
.steps { counter-reset: step; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: step; position: relative; padding: 4px 0 14px 44px; }
.steps li::before { content: counter(step); position: absolute; left: 0; top: 2px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; font-family: var(--f-display); }
.stars { display: inline-flex; gap: 2px; }
.stars button { color: var(--line-strong); padding: 4px; }
.stars button.on { color: var(--pollen); }
.stars button.on svg { fill: currentColor; }
.fav-btn.on { color: var(--pollen); }
.fav-btn.on svg { fill: currentColor; }

/* ---------- modo cocina ---------- */
.cook { display: flex; flex-direction: column; height: 100%; max-width: 860px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) var(--gutter) calc(14px + env(safe-area-inset-bottom)); }
.cook-top { display: flex; align-items: center; gap: 8px; }
.cook-top h2 { flex: 1; font-size: var(--fs-18); min-width: 0; }
.cook-progress { height: 4px; border-radius: 2px; background: var(--surface-2); margin: 8px 0 14px; overflow: hidden; }
.cook-progress i { display: block; height: 100%; background: var(--accent); transition: width var(--t-med) var(--ease); }
.cook-body { flex: 1; overflow-y: auto; }
.cook-step-n { font-family: var(--f-display); color: var(--accent-text); font-size: var(--fs-18); }
.cook-text { font-size: clamp(1.5rem, 5.2vw, 2.4rem); line-height: 1.45; margin: 6px 0 18px; }
.cook-text mark { background: var(--pollen-soft); color: inherit; border-radius: 4px; padding: 0 3px; }
.cook-title { white-space: normal; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cook-nav { display: flex; gap: 10px; padding-top: 12px; }
.cook-nav .btn { flex: 1; min-height: 56px; font-size: var(--fs-18); }
.wake { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-14); }
.wake .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); }
.wake.on .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--accent-soft); }

/* ---------- heladera, plan ---------- */
.ing-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tier-h { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 8px; }
.score { font-family: var(--f-display); font-size: var(--fs-22); color: var(--accent-text); }
.week { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 1100px) { .week { grid-template-columns: repeat(7, minmax(0, 1fr)); } .week .wd { font-size: var(--fs-14); } }
.wd { border: 1px solid var(--border-subtle); border-radius: 16px; padding: 12px 14px; background: var(--surface); box-shadow: var(--shadow-xs); min-width: 0; }
.wd.today { border-color: var(--bloom); box-shadow: 0 0 0 1px color-mix(in srgb, var(--bloom) 25%, transparent); }
.wd h3 { font-size: var(--fs-16); display: flex; justify-content: space-between; }
.wd .ws { margin-top: 8px; }
.wd .ws > span { font-size: var(--fs-12); color: var(--muted); display: block; }
.plan-item { display: flex; align-items: center; gap: 4px; min-height: 36px; }
.plan-item a { flex: 1; min-width: 0; font-size: var(--fs-14); }

/* ---------- compras ---------- */
.shop-store h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 22px 0 8px; }
.shop-item { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.shop-item .grow b { font-weight: 500; }
.shop-item.is-done .grow { color: var(--muted); text-decoration: line-through; }
.shop-item.is-have .grow b { color: var(--ink-2); }
.shop-item .src { display: block; font-size: var(--fs-12); color: var(--muted); }

/* ---------- guía ---------- */
.food { display: flex; gap: 14px; padding: 16px 4px; border-top: 1px solid var(--border-subtle); }
.food:first-child { border-top: 0; }
.food .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.food.green .ic { background: var(--accent-soft); color: var(--accent-text); }
.food.yellow .ic { background: var(--pollen-soft); color: var(--pollen-text); }
.food.red .ic { background: var(--clay-soft); color: var(--clay-text); }
.food h3 { font-size: var(--fs-17); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.ladder li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border-subtle); }
.ladder li:first-child { border-top: 0; }
.contra { border-left: 3px solid var(--line-strong); padding: 4px 0 4px 12px; margin: 6px 0; }
.contra.hit { border-color: var(--danger); background: var(--danger-soft); color: var(--danger-text); border-radius: 0 10px 10px 0; padding: 8px 12px; }
.locked { opacity: .6; }

/* ---------- progreso ---------- */
.heatmap { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
.heatmap .hm { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: var(--fs-12); font-weight: 600; text-decoration: none; color: var(--ink-2); border: 1px solid var(--border-subtle); background: var(--surface); }
.hm-complete { background: var(--accent) !important; color: var(--accent-ink) !important; border-color: var(--accent) !important; }
.hm-partial { background: var(--accent-soft) !important; color: var(--accent-text) !important; border-color: transparent !important; }
.hm-grace { background: var(--surface-2) !important; color: var(--accent-text) !important; border-style: dashed !important; border-color: var(--accent) !important; }
.hm-today { border: 2px solid var(--bloom) !important; }
.hm-empty { background: var(--surface-2) !important; }
.hm-future { opacity: .55; }
.hm-k { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; border: 1px solid var(--border-subtle); }
.badges { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.bdg { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; border: 1px solid var(--border-subtle); background: var(--surface); box-shadow: var(--shadow-xs); }
.bdg .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.bdg.on .ic { background: var(--bloom-soft); color: var(--bloom-text); }
.bdg b { display: block; }
.finding { padding: 10px 0; border-top: 1px solid var(--border-subtle); }
.finding:first-child { border-top: 0; }
.cmp-table { width: 100%; border-collapse: collapse; font-size: var(--fs-14); }
.cmp-table th, .cmp-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border-subtle); }
.cmp-table td.n { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
.journal-day { padding: 12px 0; border-top: 1px solid var(--border-subtle); }
.journal-day:first-child { border-top: 0; }
.report { background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--r-card); padding: 22px; font-family: var(--f-display); box-shadow: var(--shadow); }
.report h1 { font-size: var(--fs-28); }
.report h2 { font-size: var(--fs-18); margin-top: 18px; }
.report table { width: 100%; border-collapse: collapse; font-family: var(--f-text); font-size: var(--fs-14); }
.report td, .report th { border-bottom: 1px solid var(--border-subtle); padding: 6px 4px; vertical-align: top; text-align: left; }

/* ---------- búsqueda ---------- */
.search-group h3 { font-size: var(--fs-14); color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
.sr-item[aria-selected="true"] { background: var(--accent-soft); border-radius: 10px; }
.sr-item .li { padding-left: 8px; padding-right: 8px; }

/* ---------- ajustes y programas ---------- */
.set-sec + .set-sec { margin-top: 14px; }
.profile-row { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.emoji-pick button { font-size: 22px; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border-ctl); }
.emoji-pick button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: var(--fs-22); letter-spacing: .06em; font-weight: 600; }
.qr svg { width: 200px; height: 200px; background: #fff; padding: 10px; border-radius: 12px; }
.sync-dot { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-12); color: var(--muted); padding: 0 6px; min-height: 44px; }
.sync-dot i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
.sync-dot.ok i { background: var(--ok); }
.sync-dot.pending i { background: var(--warn); }
.sync-dot.error i { background: var(--danger); }
@media (max-width: 420px) { .sync-dot span { display: none; } }
.prog-card { display: flex; flex-direction: column; gap: 6px; }
.prog-card h3 { font-family: var(--f-display); font-weight: 700; font-size: var(--fs-22); }
.onb-steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
.onb-steps i { width: 26px; height: 4px; border-radius: 2px; background: var(--line); }
.onb-steps i.on { background: var(--accent); }
.legend .hm-k { width: 12px; height: 12px; border-radius: 4px; }
.warn-tip { color: var(--warn-text); display: flex; gap: 6px; align-items: flex-start; }

/* ---------- responsividad y contención ---------- */
.chip.on .meta, .chip[aria-pressed="true"] .meta, .btn.primary .meta, .ds.on .meta { color: inherit; }
.chips:not(.scroll) .chip { flex: 0 1 auto; max-width: 100%; white-space: normal; height: auto; min-height: 36px; padding-top: 6px; padding-bottom: 6px; text-align: left; line-height: 1.35; }
.seg.overflowing, .chips.scroll.overflowing { -webkit-mask-image: linear-gradient(to right, #000 88%, transparent); mask-image: linear-gradient(to right, #000 88%, transparent); }
.sug-mark { font-size: var(--fs-12); color: var(--muted); white-space: nowrap; border-bottom: 1px dotted var(--muted); }
html[data-text="large"] { font-size: 125%; }
html[data-text="large"] .tabbar a { font-size: 11px; }
@media (min-width: 960px) { .topbar [data-action="openSearch"] { display: none; } }
.btn-row > *, .row > .btn { min-width: 0; }

/* ==== print.css ==== */
/* Impresión: solo el informe (.print-root), tipografía serif, sin fondos. */
@media print {
  @page { margin: 16mm; }
  html, body { background: #fff !important; color: #000 !important; }
  body * { visibility: hidden !important; }
  .print-root, .print-root * { visibility: visible !important; }
  .print-root { position: absolute; left: 0; top: 0; width: 100%; border: 0 !important; padding: 0 !important; box-shadow: none !important; background: #fff !important; color: #000 !important; font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .print-root .no-print { display: none !important; }
  .print-root .table-wrap { overflow: visible !important; }
  .print-root table { font-size: 10.5pt; }
  .print-root td, .print-root th { border-color: #999 !important; }
  .print-root h1, .print-root h2 { break-after: avoid; }
  .print-root tr { break-inside: avoid; }
  .tabbar, .rail, .topbar, #timers, #toasts, dialog { display: none !important; }
  .shell { margin: 0 !important; }
}

  function ringCard(ctx) {

    var cons = s.constancy == null ? '—' : Math.round(s.constancy * 100) + ' %';
    return '<section class="card ring-card" aria-label="Avance del día">' + K.ring(r.total ? r.done / r.total : 0, 112, '<span><b>' + r.done + '</b><small>de ' + r.total + '</small></span>', r.done + ' de ' + r.total + ' hábitos hechos') +
      '<div class="ring-stats"><div class="ring-stat"><b class="num">' + cons + '</b><span>constancia</span></div>' +
      '<div class="ring-stat"><b class="num">' + s.streak + '</b><span>' + (s.streak === 1 ? 'día de racha' : 'días de racha') + (s.bestStreak > s.streak ? ' · mejor ' + s.bestStreak : '') + '</span></div>' +
      '<div class="ring-stat"><b class="num">' + s.points + '</b><span>puntos</span></div></div>' +
      (r.complete ? '<p class="done-line">' + I('flor', 'sm') + ' Día completo. Bien ahí.</p>' : (2 - s.graceUsed > 0 && ctx.clock.status === 'active' ? '<p class="meta grace-line">' + I('hoja', 'sm') + ' Te quedan ' + U.plural(2 - s.graceUsed, 'día') + ' de gracia: si un día no llegás, la racha no se corta.</p>' : '')) +
      '</section>';
  }

  function habitsCard(ctx) {
    var day = ctx.row.day || { habits: {} };
    var conds = ctx.p.settings.conditions || [];
    var hs = ctx.row.habits;
    if (!hs.length) return '<section class="card"><div class="card-h"><h2>Hábitos</h2></div><p class="muted">Este programa no tiene hábitos para esta fase.</p></section>';
    var dis = ctx.editable ? '' : ' disabled';
    var items = hs.map(function (h) {
      var st = day.habits && day.habits[h.id];
      var warn = L.habitWarnings(h, conds);
      var warnTxt = warn.length ? '<span class="tag warn">' + I('alerta', 'sm') + 'Consultá: ' + esc(warn.map(function (c) { var x = L.idx().conditions[c]; return x ? x.label.split(' (')[0].toLowerCase() : c; }).join(', ')) + '</span>' : '';
      return '<li class="habit' + (st === 'done' ? ' is-done' : st === 'skip' ? ' is-skip' : '') + '">' +
        '<button class="habit-main" data-action="habit" data-h="' + esc(h.id) + '" aria-pressed="' + (st === 'done') + '"' + dis + '><span class="tick">' + I('check') + '</span><span class="grow"><span class="h-t">' + esc(h.text) + '</span>' + (st === 'skip' ? '<span class="meta">Hoy no, a conciencia</span>' : '') + warnTxt + '</span></button>' +
        '<div class="habit-side">' + (h.tip ? '<button class="icon-btn sm" data-action="habitTip" data-h="' + esc(h.id) + '" aria-expanded="' + !!(A.ui.tip === h.id) + '" aria-label="Consejo">' + I('info', 'sm') + '</button>' : '') +
        (ctx.editable && st !== 'done' ? '<button class="btn ghost sm" data-action="habitSkip" data-h="' + esc(h.id) + '">' + (st === 'skip' ? 'Deshacer' : 'Hoy no') + '</button>' : '') + '</div>' +
        (A.ui.tip === h.id && h.tip ? '<p class="habit-tip">' + esc(h.tip) + '</p>' : '') + (warn.length && h.warn ? warn.map(function (c) { return h.warn[c] ? '<p class="habit-tip warn-tip">' + I('alerta', 'sm') + ' ' + esc(h.warn[c]) + '</p>' : ''; }).join('') : '') + '</li>';
    }).join('');
    return '<section class="card" aria-labelledby="h-habitos"><div class="card-h"><h2 id="h-habitos">' + (ctx.idx === 0 ? 'Para prepararte' : 'Hábitos del día') + '</h2><span class="meta">' + ctx.row.done + '/' + ctx.row.total + '</span></div><ul class="list habits">' + items + '</ul></section>';
  }

  function waterCard(ctx) {
    var total = ctx.row.water, goal = ctx.sum.waterGoal;
    var ratio = Math.min(1, total / goal);
    var lvl = (100 - ratio * 82).toFixed(1);
    var glass = '<svg class="glass" viewBox="0 0 64 88" width="56" height="77" aria-hidden="true"><defs><clipPath id="gclip"><path d="M8 6h48l-6 76H14z"/></clipPath></defs><rect class="gw" x="0" y="' + lvl + '" width="64" height="100" clip-path="url(#gclip)"/><path class="gl" d="M8 6h48l-6 76H14z"/></svg>';
    var dis = ctx.editable ? '' : ' disabled';
    return '<section class="card water" aria-labelledby="h-agua"><div class="card-h"><h2 id="h-agua">Agua</h2><button class="btn ghost sm" data-action="waterGoal">Meta: ' + (goal / 1000).toString().replace('.', ',') + ' l</button></div>' +
      '<div class="row">' + glass + '<div class="grow"><p class="water-num"><b class="num">' + total + '</b> <span class="meta">de ' + goal + ' ml</span></p>' +
      '<div class="bar-h mb-s" style="margin-bottom:10px"><i style="width:' + Math.round(ratio * 100) + '%"></i></div>' +
      '<div class="btn-row"><button class="btn sm" data-action="water" data-ml="250"' + dis + '>' + I('mas', 'sm') + '250 ml</button><button class="btn sm" data-action="water" data-ml="500"' + dis + '>' + I('mas', 'sm') + '500 ml</button>' +
      (ctx.row.day && ctx.row.day.water.length && ctx.editable ? '<button class="btn ghost sm" data-action="waterUndo" aria-label="Deshacer el último vaso">' + I('deshacer', 'sm') + 'Deshacer</button>' : '') + '</div></div></div>' +
      '<p class="sr-only" aria-live="polite">' + total + ' mililitros de ' + goal + '</p></section>';
  }

  /* ---------- comidas ---------- */
  var SLOT_ICON = { desayuno: 'amanecer', almuerzo: 'sol', merienda: 'taza', cena: 'luna' };
  function mealsCard(ctx) {
    var slots = L.slots();
    var planDay = ctx.iso && ctx.p.plan[ctx.iso];
    var body = slots.map(function (s) {
      var items = L.mealItems(ctx.row.day, s.id);
      var list = items.map(function (m) {
        var r = m.recipeId ? L.recipe(m.recipeId, ctx.p) : null;
        var hits = r ? L.recipeAllergyHits(r, ctx.p) : L.textAllergyHits(m.name, null, ctx.p);
        return '<li class="meal' + (m.done ? ' is-done' : '') + '"><button class="tick sq' + (m.done ? ' on' : '') + '" data-action="mealToggle" data-slot="' + s.id + '" data-id="' + esc(m.id) + '" aria-pressed="' + !!m.done + '" aria-label="' + (m.done ? 'Desmarcar' : 'Marcar como comida') + ': ' + esc(m.name) + '"' + (ctx.editable ? '' : ' disabled') + '>' + I('check') + '</button>' +
          '<span class="grow">' + (r ? '<a href="#/cocina/receta/' + encodeURIComponent(r.id) + '">' + esc(m.name) + '</a>' : esc(m.name)) + (hits.any ? ' <span class="tag alert">' + I('alerta', 'sm') + 'alérgeno</span>' : '') + '</span>' +
          (ctx.editable ? '<button class="icon-btn sm" data-action="mealDelete" data-slot="' + s.id + '" data-id="' + esc(m.id) + '" aria-label="Quitar ' + esc(m.name) + '">' + I('borrar', 'sm') + '</button>' : '') + '</li>';
      }).join('');
      var fromPlan = U.arr(planDay && planDay[s.id]).filter(function (rid) { return !items.some(function (m) { return m.recipeId === rid; }); });
      var planChips = fromPlan.map(function (rid) { var r = L.recipe(rid, ctx.p); return r ? '<button class="chip soft" data-action="mealAddRecipe" data-slot="' + s.id + '" data-r="' + esc(rid) + '"' + (ctx.editable ? '' : ' disabled') + '>' + I('calendario', 'sm') + 'Del plan: ' + esc(r.title) + '</button>' : ''; }).join('');
      var sug = '';
      if (!items.length && !fromPlan.length && ctx.editable) {
        sug = L.suggest({ profile: ctx.p, editionId: ctx.ed.id, program: ctx.prog, phaseId: ctx.row.phaseId, slot: s.id, dayIdx: ctx.idx, dateISO: ctx.iso, n: 2 }).map(function (x) {
          return '<button class="chip soft sug" data-action="mealAddRecipe" data-slot="' + s.id + '" data-r="' + esc(x.recipe.id) + '">' + I('mas', 'sm') + '<span class="sug-title">' + esc(x.recipe.title) + '</span> <span class="meta">· ' + esc(x.reason) + '</span></button>';
        }).join('');
      }
      return '<div class="slot"><div class="slot-h"><h3>' + I(SLOT_ICON[s.id] || 'bowl', 'sm') + ' ' + esc(s.label) + '</h3>' + (ctx.editable ? '<button class="btn ghost sm" data-action="mealAddSheet" data-slot="' + s.id + '">' + I('mas', 'sm') + 'Agregar</button>' : '') + '</div>' +
        (list ? '<ul class="list meals">' + list + '</ul>' : '') + (planChips || sug ? '<div class="chips">' + planChips + sug + '</div>' : (!list ? '<p class="meta">Sin registrar.</p>' : '')) + '</div>';
    }).join('');
    return '<section class="card" aria-labelledby="h-comidas"><div class="card-h"><h2 id="h-comidas">Comidas</h2><a class="btn ghost sm" href="#/cocina/plan">Plan</a></div>' + body + '</section>';
  }

  /* ---------- check-in ---------- */
  function checkinCard(ctx) {
    var tx = L.tx(), day = ctx.row.day, c = (day && day.checkin) || {};
    var done = L.hasCheckin(day);
    var open = A.ui.checkinOpen === ctx.ed.id + ':' + ctx.idx || !done;
    if (!ctx.editable && !done) return '<section class="card"><div class="card-h"><h2>Check-in</h2></div><p class="muted">Se completa ese día.</p></section>';
    if (!open) {
      var bits = [];
      if (c.energy) bits.push('Energía ' + esc((U.arr(tx.energyLevels).filter(function (x) { return x.v === Number(c.energy); })[0] || {}).label || c.energy));
      if (c.mood) bits.push('Ánimo ' + esc((U.arr(tx.moodLevels).filter(function (x) { return x.v === Number(c.mood); })[0] || {}).label || c.mood));
      if (c.digestion) bits.push('Digestión: ' + esc((L.tx().digestionStates.filter(function (x) { return x.id === c.digestion; })[0] || {}).label || c.digestion));
      var sy = U.arr(c.symptoms).map(function (s) { var x = L.idx().symptoms[s]; return x ? x.label : s; }).concat(U.arr(c.customSymptoms));
      return '<section class="card" aria-labelledby="h-checkin"><div class="card-h"><h2 id="h-checkin">Check-in</h2><span class="tag accent">' + I('check', 'sm') + 'Hecho</span></div><p>' + bits.join(' · ') + '</p>' + (sy.length ? '<p class="meta">Síntomas: ' + esc(sy.join(', ')) + '</p>' : '') + (c.notes ? '<p class="note">' + esc(c.notes) + '</p>' : '') +
        (ctx.editable ? '<button class="btn sm mt-s" data-action="checkinOpen">' + I('editar', 'sm') + 'Editar</button>' : '') + '</section>';
    }
    function scale(field, list) {
      return '<div class="scale" role="group" aria-label="' + (field === 'energy' ? 'Energía' : 'Ánimo') + '">' + U.arr(list).map(function (x) {
        var on = Number(c[field]) === x.v;
        return '<button class="sc' + (on ? ' on' : '') + '" data-action="checkin" data-f="' + field + '" data-v="' + x.v + '" aria-pressed="' + on + '" aria-label="' + esc(x.label) + '"><span aria-hidden="true">' + esc(x.emoji || x.v) + '</span><small>' + esc(x.label.split(' /')[0]) + '</small></button>';
      }).join('') + '</div>';
    }
    var dig = U.arr(tx.digestionStates).map(function (x) { var on = c.digestion === x.id; return '<button class="chip' + (on ? ' on' : '') + '" data-action="checkin" data-f="digestion" data-v="' + x.id + '" aria-pressed="' + on + '">' + esc((x.emoji ? x.emoji + ' ' : '') + x.label) + '</button>'; }).join('');
    var sym = U.arr(tx.symptoms).map(function (x) {
      var on = U.arr(c.symptoms).indexOf(x.id) > -1;
      return '<span class="symp"><button class="chip' + (on ? ' on' : '') + '" data-action="symptom" data-s="' + x.id + '" aria-pressed="' + on + '">' + esc(x.label) + '</button>' + (on && x.sos && L.idx().sos[x.sos] ? '<a class="sos-link" href="#/guia/sos/' + encodeURIComponent(x.sos) + '">' + I('botiquin', 'sm') + 'SOS</a>' : '') + '</span>';
    }).join('');
    var custom = U.arr(c.customSymptoms).map(function (s) { return '<button class="chip on" data-action="customSymptomDel" data-s="' + esc(s) + '" aria-label="Quitar ' + esc(s) + '">' + esc(s) + I('cerrar', 'sm x') + '</button>'; }).join('');
    return '<section class="card checkin" aria-labelledby="h-checkin"><div class="card-h"><h2 id="h-checkin">Check-in</h2><span class="meta">10 segundos</span></div>' +
      '<p class="label">Energía</p>' + scale('energy', tx.energyLevels) +
      '<p class="label">Ánimo</p>' + scale('mood', tx.moodLevels) +
      '<p class="label">Digestión</p><div class="chips">' + dig + '</div>' +
      '<p class="label">Síntomas</p><div class="chips">' + sym + custom + '</div>' +
      '<form class="row mt-s" data-submit="customSymptomAdd"><input class="input" name="s" placeholder="Otro síntoma…" aria-label="Agregar otro síntoma" maxlength="60"><button class="btn sm">Agregar</button></form>' +
      '<label class="field mt"><span>Notas del día</span><textarea class="input" id="checkin-notes" data-bind="checkinNotes" rows="3" placeholder="Cómo dormiste, qué notaste, qué te costó…">' + esc(c.notes || '') + '</textarea></label>' +
      (done ? '<button class="btn primary sm" data-action="checkinClose">Listo</button>' : '') + '<p class="meta">Se guarda solo.</p></section>';
  }

  /* ---------- notas, cita y «para mañana» ---------- */
  function notesCard(ctx) {
    var out = [];
    var notes = U.arr(ctx.prog.dayNotes).filter(function (n) { return n.day === ctx.idx; });
    var note = notes.filter(function (n) { return !n.phase || n.phase === ctx.row.phaseId; })[0] || (notes.length === 1 && !notes[0].phase ? notes[0] : null);
    if (note) out.push('<p class="day-note">' + esc(note.text) + '</p>');
    var q = U.arr(A.dx().quotes).filter(function (x) { return x.day === ctx.idx; })[0];
    if (q && ctx.prog.id === 'detox-primavera-21') {
      var who = q.attribution === 'verificada' ? q.author : q.attribution === 'popular' ? 'dicho popular' : 'atribuida a ' + q.author;
      out.push('<figure class="quote"><blockquote>' + esc(q.text) + '</blockquote><figcaption>— ' + esc(who) + (q.theme ? ' · ' + esc(q.theme) : '') + '</figcaption></figure>');
    }
    var tom = tomorrow(ctx);
    if (tom.length) out.push('<h3 class="mt">Para mañana</h3><ul class="list">' + tom.join('') + '</ul>');
    if (!out.length) return '';
    return '<section class="card notes" aria-label="Nota del día">' + out.join('') + '</section>';
  }
  function tomorrow(ctx) {
    var list = [];
    if (!ctx.iso) return list;
    var t = U.addDays(ctx.iso, 1);
    var ids = L.planEntries(ctx.p.plan, t, t).map(function (e) { return e.recipeId; });
    L.soaksForRecipes(ids, ctx.p).forEach(function (s) {
      list.push('<li class="li">' + I('frasco') + '<span class="grow"><b>Remojar ' + esc(s.soak.name.toLowerCase()) + '</b><span class="meta">' + esc(s.soak.label || (s.soak.optH + ' h')) + ' · ' + (s.soak.discardWater ? 'descartar el agua' : 'no descartar el agua') + '</span></span><a class="btn ghost sm" href="#/cocina/remojos">Ver</a></li>');
    });
    var next = ctx.sum.days[ctx.idx + 1];
    if (next && next.phaseId !== ctx.row.phaseId) list.push('<li class="li">' + I('hoja') + '<span class="grow"><b>Mañana empieza: ' + esc(L.phase(ctx.prog, next.phaseId).name) + '</b><span class="meta">' + esc(L.phase(ctx.prog, next.phaseId).desc || '') + '</span></span></li>');
    var fer = U.arr(A.dx().prep && A.dx().prep.ferments);
    U.arr(ctx.p.ferments).forEach(function (f) {
      if (f.deleted) return;
      var def = fer.filter(function (x) { return x.id === f.recipe || x.recipe === f.recipe; })[0];
      if (!def) return;
      var d = U.diffDays(U.isoFromTs(f.startedAt), t);
      U.arr(def.milestones).forEach(function (m) { if (m.day === d) list.push('<li class="li">' + I('frasco') + '<span class="grow"><b>Fermento: día ' + d + '</b><span class="meta">' + esc(m.text) + '</span></span></li>'); });
      if (d === def.readyDaysMin) list.push('<li class="li">' + I('chispa') + '<span class="grow"><b>Tu fermento podría estar listo</b><span class="meta">Probalo: entre ' + def.readyDaysMin + ' y ' + def.readyDaysMax + ' días.</span></span></li>');
    });
    return list;
  }

  /* ---------- estados especiales ---------- */
  function welcome(ctx) {
    var progs = L.allPrograms(A.P());
    var sel = A.ui.wProg || (ctx ? ctx.prog.id : 'detox-primavera-21');
    var prog = L.program(sel, A.P()) || progs[0];
    if (!prog) return K.empty('No hay programas cargados', 'Faltan los datos de la app.', '');
    var mode = A.ui.wMode || (ctx ? ctx.ed.startMode : null) || prog.defaultStartMode;
    var today = A.today();
    var opts = U.startChoices(today).map(function (o) { return [o[0], o[0], o[1]]; });
    var dsel = A.ui.wDate || today;
    var modes = U.arr(prog.startModes);
    return '<section class="welcome card">' + '<div class="welcome-art">' + K.plant(0, 120) + '</div>' +
      '<h1>' + (ctx ? 'Elegí cuándo empezar' : 'Empezá tu programa') + '</h1><p class="muted">' + (ctx ? 'Tu edición importada no tiene una fecha válida. Elegila y seguimos.' : 'Un paso por vez: elegí el programa, la fecha y cómo arrancar. Podés cambiarlo después.') + '</p>' +
      (ctx ? '' : '<label class="field"><span>Programa</span><select class="input" data-change="wProg">' + progs.map(function (x) { return '<option value="' + esc(x.id) + '"' + (x.id === prog.id ? ' selected' : '') + '>' + esc(x.name + (x.days ? ' · ' + x.days + ' días' : '')) + '</option>'; }).join('') + '</select></label>') +
      '<p class="label">Fecha de inicio</p><div class="chips">' + opts.map(function (o) { return '<button class="chip' + (dsel === o[2] ? ' on' : '') + '" data-action="wDate" data-d="' + o[2] + '" aria-pressed="' + (dsel === o[2]) + '">' + o[1] + ' <span class="meta">' + U.fmtDate(o[2], 'short') + '</span></button>'; }).join('') + '</div>' +
      '<label class="field mt-s"><span class="sr-only">Otra fecha</span><input type="date" class="input" data-change="wDateInput" value="' + esc(dsel) + '" aria-label="Elegir otra fecha"></label>' +
      (modes.length > 1 ? '<p class="label">Cómo empezar</p><div class="stack-s">' + modes.map(function (m) { return '<label class="check"><input type="radio" name="wmode" value="' + esc(m.id) + '" data-change="wMode"' + (m.id === mode ? ' checked' : '') + '><span>' + esc(m.label) + '</span></label>'; }).join('') + '</div>' : '') +
      '<div class="btn-row mt"><button class="btn primary" data-action="startEdition">' + I('planta', 'sm') + (ctx ? 'Guardar fecha' : 'Empezar') + '</button><a class="btn ghost" href="#/programas">Ver programas</a></div>' +
      K.healthNote() + '</section>';
  }
  A.changes.wProg = function (el) { A.ui.wProg = el.value; A.ui.wMode = null; A.render(); };
  A.changes.wMode = function (el) { A.ui.wMode = el.value; };
  A.actions.wDate = function (el) { A.ui.wDate = el.dataset.d; A.render(); };
  A.changes.wDateInput = function (el) { if (U.isValidISO(el.value)) { A.ui.wDate = el.value; A.render(); } };
  A.actions.startEdition = function () {
    var ed = A.ED();
    var date = A.ui.wDate || A.today();
    if (ed && !U.isValidISO(ed.startDate)) {
      A.update(function (s, p) { var e = p.editions[ed.id]; e.startDate = date; e.startMode = A.ui.wMode || e.startMode; e.status = 'active'; e.updatedAt = Date.now(); });
    } else {
      var progId = A.ui.wProg || 'detox-primavera-21';
      var prog = L.program(progId, A.P());
      A.startEdition(progId, date, A.ui.wMode || prog.defaultStartMode);
    }
    A.ui.wDate = A.ui.wProg = A.ui.wMode = null;
    A.toast(date === A.today() ? 'Arrancamos. Día 1: hoy.' : 'Listo: empezás el ' + U.fmtDate(date) + '.');
    A.go('/hoy');
  };
  /* Crea una edición nueva (archiva la activa si existe) */
  A.startEdition = function (programId, date, mode) {
    A.update(function (s, p) {
      var cur = p.activeEdition && p.editions[p.activeEdition];
      if (cur && cur.status !== 'done') { cur.status = 'archived'; cur.closedAt = Date.now(); cur.updatedAt = Date.now(); }
      var e = L.newEdition(programId, date, mode, Date.now());
      p.editions[e.id] = e; p.activeEdition = e.id;
    }, { meta: true });
  };

  function countdown(ctx) {
    var c = ctx.clock;
    var start = ctx.ed.startDate;
    // calendario de descenso de cafeína: a la mitad cada 2 días
    var steps = [[6, 'Tomá la mitad de tu cafeína o mate de siempre'], [4, 'Bajá otra vez a la mitad (un cuarto)'], [2, 'Solo un poquito, o ya nada'], [0, 'Día 1: sin estimulantes']];
    var cal = steps.map(function (s) {
      var d = U.addDays(start, -s[0]);
      var past = d < A.today(), isToday = d === A.today();
      return '<li class="li' + (past ? ' muted' : '') + '"><span class="tag ' + (isToday ? 'bloom' : '') + '">' + U.fmtDate(d, 'day') + '</span><span class="grow">' + esc(s[1]) + '</span></li>';
    }).join('');
    var d1 = L.planEntries(ctx.p.plan, start, U.addDays(start, 2)).map(function (e) { return e.recipeId; });
    var soaks = L.soaksForRecipes(d1, ctx.p);
    return '<section class="card tint countdown"><div class="row"><div class="grow"><h2>Faltan ' + U.plural(c.daysUntil, 'día') + '</h2><p>Empezás el ' + esc(U.fmtDate(start, 'long')) + '.</p></div><span class="big-count num" aria-hidden="true">' + c.daysUntil + '</span></div>' +
      '<h3 class="mt">Bajar la cafeína de a poco</h3><ul class="list">' + cal + '</ul>' +
      '<div class="btn-row mt"><a class="btn" href="#/compras/base">' + I('compras', 'sm') + 'Compras iniciales</a><a class="btn" href="#/cocina/plan">' + I('calendario', 'sm') + 'Planificar la primera semana</a>' + (soaks.length ? '<a class="btn" href="#/cocina/remojos">' + I('frasco', 'sm') + U.plural(soaks.length, 'remojo') + ' para empezar</a>' : '') + '</div></section>';
  }

  function closingCard(ctx) {
